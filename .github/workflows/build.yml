name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The GUI is WPF and the CLI opens \\.\PhysicalDriveN, so this only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $env:DOTNET_NOLOGO = '1'
          dotnet build BlRecover.sln -c Release --nologo

      - name: Self-test
        shell: pwsh
        # Runs entirely on synthetic images - no physical disk is touched.
        run: dotnet run --project src/BlRecover.Cli -c Release -- selftest

      - name: UI smoke test
        shell: pwsh
        run: |
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $env:DOTNET_NOLOGO = '1'
          $app = Resolve-Path 'src/BlRecover.App/bin/Release/net10.0-windows/BlRecover.App.exe'
          & $app --ui-smoke-test
          Get-Content "$env:TEMP/blrecover-ui-smoke.log"

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: blrecover-cli
          path: src/BlRecover.Cli/bin/Release/net10.0-windows/blrecover.exe
          if-no-files-found: error

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: blrecover-gui
          path: |
            src/BlRecover.App/bin/Release/net10.0-windows/BlRecover.App.exe
            src/BlRecover.App/bin/Release/net10.0-windows/MaterialDesignThemes.dll
          if-no-files-found: error